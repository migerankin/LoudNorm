[project]
name = "autolevel"
version = "0.2.0"
description = "Automatic per-application volume balancing for Windows"
requires-python = ">=3.9"
dependencies = [
    "pycaw>=20240210",
    "comtypes>=1.2",
    "psutil>=5.9",
    # Windows media transport controls, for targeted pause/play of one app.
    "winsdk>=1.0.0b10",
    # System tray icon; pillow draws the icon art.
    "pystray>=0.19",
    "pillow>=10",
    # WASAPI loopback capture/playback for true above-unity endpoint boost.
    "soundcard>=0.4.5,<0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
autolevel = "autolevel.cli:main"

[project.gui-scripts]
autolevel-gui = "autolevel.gui_main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autolevel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
